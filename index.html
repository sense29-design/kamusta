/* ===== Engine ===== */
function norm(s){
  s=String(s).toLowerCase();
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  s=s.replace(/[\u2018\u2019`]/g,"'");
  s=s.replace(/(.)\1{2,}/g,'$1');      /* pagoooood -> pagod */
  s=s.replace(/[-_\/]+/g,' ');
  s=s.replace(/[^a-z' ]+/g,' ');
  s=s.replace(/\s+/g,' ');
  return ' '+s.trim()+' ';
}

function scoreTheme(t,def){
  var total=0, seen={};
  [[def.s||[],4],[def.w||[],2]].forEach(function(g){
    g[0].forEach(function(k){
      var from=0, idx;
      while((idx=t.indexOf(k,from))>-1){
        var start=idx+(k.charAt(0)===' '?1:0);
        while(start>0 && t.charAt(start-1)!==' '){ start--; }   /* simula ng buong salita */
        var before=t.slice(Math.max(0,start-18),start);
        if(!NEG.test(before)){ if(!seen[k]){ total+=g[1]; seen[k]=1; } break; }
        from=idx+k.length;
      }
    });
  });
  return total;
}

/* Ibabalik ang pinakabagay na tema, o null kung walang malinaw na tugma */
function detect(text){
  var t=norm(text), score={}, best=null, bestN=0;
  Object.keys(KEYS).forEach(function(k){ score[k]=scoreTheme(t,KEYS[k]); });
  if(NOT_OKAY.test(t)){ score.okay=0; score.malungkot+=3; }
  PRIORITY.forEach(function(k){ if((score[k]||0)>bestN){ bestN=score[k]; best=k; } });
  return best;
}

function isCrisis(text){ return CRISIS.test(norm(text)); }

function choose(text){
  if(isCrisis(text)) return {theme:'malungkot', verse:byRef('Psalm 34:18'), crisis:true};
  var theme=detect(text)||'general';
  return {theme:theme, verse:pick(V[theme]), crisis:false};
}
